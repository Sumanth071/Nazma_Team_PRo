version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: coloai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: coloai
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: coloai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: coloai-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./ai_service:/app

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: coloai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/coloai
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=coloai_super_secure_jwt_secret_key_2026_polyps
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - redis
      - ai-service
    volumes:
      - ./server/uploads:/app/uploads

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: coloai-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
